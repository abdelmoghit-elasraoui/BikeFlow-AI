name: Audit monthly trips
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
      - run: uv sync --locked
      - name: Download complete February 2026 archive
        run: |
          mkdir -p data/raw/trips
          curl --fail --silent --show-error --location --retry 3 --output data/raw/trips/202602-citibike-tripdata.zip https://s3.amazonaws.com/tripdata/202602-citibike-tripdata.zip
      - name: Collect metadata and inspect every CSV part
        run: |
          uv run bikeflow collect --count 1
          SNAPSHOT=$(find data/raw/gbfs -name '*.json.gz' | sort | tail -1)
          uv run bikeflow audit-trips data/raw/trips/202602-citibike-tripdata.zip --snapshot "$SNAPSHOT" --report-dir reports/first-session
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-audit-${{ github.run_id }}
          path: |
            reports/first-session/
            data/processed/
            data/raw/gbfs/
          retention-days: 7
          if-no-files-found: error
