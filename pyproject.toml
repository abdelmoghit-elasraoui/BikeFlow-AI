[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bikeflow-ai"
version = "0.1.0"
description = "Data foundation for predictive bike-share rebalancing"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.156.7",
    "lightgbm>=4.7.0",
    "pandas>=2.2,<3",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
bikeflow = "bikeflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeflow"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
]
