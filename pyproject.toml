[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bikeflow-ai"
version = "0.1.0"
description = "Data foundation for predictive bike-share rebalancing"
requires-python = ">=3.12,<3.14"
dependencies = ["pandas>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
bikeflow = "bikeflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bikeflow"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
